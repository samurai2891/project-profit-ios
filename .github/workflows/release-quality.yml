name: Release Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  RELEASE_QUALITY_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/release-quality
  RELEASE_QUALITY_EVIDENCE_DIR: ${{ github.workspace }}/Docs/release/quality
  XCODEGEN_VERSION: 2.45.3

jobs:
  xcodegen-sync:
    name: XcodeGen Sync
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}"
          archive_path="$RUNNER_TEMP/xcodegen-${XCODEGEN_VERSION}.zip"

          if [[ ! -x "$install_root/xcodegen/bin/xcodegen" ]]; then
            curl -LsSf \
              "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
              -o "$archive_path"
            rm -rf "$install_root"
            mkdir -p "$install_root"
            unzip -q "$archive_path" -d "$install_root"
          fi

          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Verify project.yml and xcodeproj sync
        id: sync
        shell: bash
        run: |
          chmod +x scripts/check_xcodegen_sync.sh
          set +e
          output="$(scripts/check_xcodegen_sync.sh 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          status="$(awk -F= '/^status=/{print $2; exit}' <<< "$output")"
          reason="$(awk -F= '/^reason=/{print $2; exit}' <<< "$output")"
          if [[ -z "$status" ]]; then
            status="error"
          fi
          if [[ -z "$reason" ]]; then
            reason="xcodegen sync output parsing failed"
          fi

          {
            echo "### xcodegen-sync"
            echo "- status: $status"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" == "error" || "$exit_code" -ne 0 ]]; then
            exit 1
          fi

  simulator-health:
    name: Simulator Health
    runs-on: macos-latest
    needs: xcodegen-sync
    outputs:
      status: ${{ steps.health.outputs.status }}
      reason: ${{ steps.health.outputs.reason }}
      simulator_device: ${{ steps.health.outputs.simulator_device }}
      simulator_id: ${{ steps.health.outputs.simulator_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check simulator health
        id: health
        shell: bash
        run: |
          set +e
          output="$(bash scripts/check_simulator_health.sh 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          status="$(awk -F= '/^status=/{print $2; exit}' <<< "$output")"
          reason="$(awk -F= '/^reason=/{print $2; exit}' <<< "$output")"
          simulator_device="$(awk -F= '/^simulator_device=/{print $2; exit}' <<< "$output")"
          simulator_id="$(awk -F= '/^simulator_id=/{print $2; exit}' <<< "$output")"

          if [[ -z "$status" ]]; then
            status="error"
          fi
          if [[ -z "$reason" ]]; then
            reason="simulator health check output parsing failed"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [[ -n "$simulator_device" ]]; then
            echo "simulator_device=$simulator_device" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$simulator_id" ]]; then
            echo "simulator_id=$simulator_id" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### simulator-health"
            echo "- status: $status"
            echo "- reason: $reason"
            if [[ -n "$simulator_device" ]]; then
              echo "- simulator_device: $simulator_device"
            fi
            if [[ -n "$simulator_id" ]]; then
              echo "- simulator_id: $simulator_id"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" == "error" || "$exit_code" -ne 0 ]]; then
            echo "simulator-health failed: $reason" >&2
            exit 1
          fi

  release-build:
    name: Release Build
    runs-on: macos-latest
    needs: xcodegen-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release build lane
        id: lane
        shell: bash
        env:
          RELEASE_QUALITY_LANE: release-build
          RELEASE_QUALITY_MODE: build
          RELEASE_QUALITY_CONFIGURATION: Release
          RELEASE_QUALITY_DESTINATION: generic/platform=iOS
          RELEASE_QUALITY_ARTIFACTS_DIR: ${{ env.RELEASE_QUALITY_ARTIFACT_ROOT }}/release-build
        run: |
          chmod +x scripts/run_release_quality_lane.sh
          set +e
          output="$(scripts/run_release_quality_lane.sh 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"

          status="$(awk -F= '/^status=/{print $2; exit}' <<< "$output")"
          reason="$(awk -F= '/^reason=/{print $2; exit}' <<< "$output")"
          summary_path="$(awk -F= '/^summary_path=/{print $2; exit}' <<< "$output")"
          log_path="$(awk -F= '/^log_path=/{print $2; exit}' <<< "$output")"

          if [[ -z "$status" ]]; then
            status="error"
          fi
          if [[ -z "$reason" ]]; then
            reason="release build lane output parsing failed"
          fi
          if [[ -z "$summary_path" ]]; then
            summary_path="${{ env.RELEASE_QUALITY_ARTIFACT_ROOT }}/release-build/summary.md"
          fi
          if [[ -z "$log_path" ]]; then
            log_path="${{ env.RELEASE_QUALITY_ARTIFACT_ROOT }}/release-build/xcodebuild.log"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
          echo "log_path=$log_path" >> "$GITHUB_OUTPUT"

          if [[ "$exit_code" -ne 0 ]]; then
            exit "$exit_code"
          fi

      - name: Append lane summary
        if: always()
        shell: bash
        run: |
          if [[ -f "${{ steps.lane.outputs.summary_path }}" ]]; then
            cat "${{ steps.lane.outputs.summary_path }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-artifacts
          path: ${{ env.RELEASE_QUALITY_ARTIFACT_ROOT }}/release-build
          if-no-files-found: warn

